apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}   # read-only access for reviewers
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - name: GF_SECURITY_ADMIN_PASSWORD   # generated by scripts/deploy.sh, never stored in git
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: password}
          ports:
            - {name: web, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: web}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: providers, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: datasource
          configMap: {name: grafana-datasource}
        - name: providers
          configMap: {name: grafana-dashboard-providers}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: web, port: 3000, targetPort: web}
