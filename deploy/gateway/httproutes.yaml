# 1. Default route: everything goes to app v1 ("Hello World!").
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: demo
spec:
  parentRefs:
    - name: demo
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: app-v1
          port: 80
---
# 2. Path-based routing: /v1 -> app-v1, /v2 -> app-v2 (prefix stripped before the backend).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: by-path
  namespace: demo
spec:
  parentRefs:
    - name: demo
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - name: app-v1
          port: 80
    - matches:
        - path: {type: PathPrefix, value: /v2}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - name: app-v2
          port: 80
---
# 3. Traffic splitting: /canary sends 80% to v1 and 20% to v2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
  namespace: demo
spec:
  parentRefs:
    - name: demo
  rules:
    - matches:
        - path: {type: PathPrefix, value: /canary}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - name: app-v1
          port: 80
          weight: 80
        - name: app-v2
          port: 80
          weight: 20
---
# 4. Hostname-based routing: Host "v2.demo.local" always reaches app-v2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: by-host
  namespace: demo
spec:
  parentRefs:
    - name: demo
  hostnames:
    - v2.demo.local
  rules:
    - backendRefs:
        - name: app-v2
          port: 80
