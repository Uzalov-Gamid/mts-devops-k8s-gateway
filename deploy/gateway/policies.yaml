# Envoy Gateway policies attached to HTTPRoutes.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: limited-rate-limit
  namespace: demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: limited
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 5
            unit: Minute
---
# Resilience for the default route: retry connection failures and 5xx, bound the request time.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: hello-resilience
  namespace: demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hello
  retry:
    numRetries: 3
    retryOn:
      triggers: ["connect-failure", "reset", "5xx"]
  timeout:
    http:
      requestTimeout: 10s
