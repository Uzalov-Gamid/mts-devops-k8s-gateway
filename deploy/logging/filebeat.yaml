apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: logging
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: filebeat}
  template:
    metadata:
      labels: {app.kubernetes.io/name: filebeat}
    spec:
      serviceAccountName: filebeat
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:9.4.7
          args: ["-c", "/etc/filebeat.yml", "-e", "--strict.perms=false"]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: 50m, memory: 100Mi}
            limits: {memory: 300Mi}
          securityContext:
            runAsUser: 0  # required to read /var/log/containers on the host
          volumeMounts:
            - {name: config, mountPath: /etc/filebeat.yml, subPath: filebeat.yml, readOnly: true}
            - {name: data, mountPath: /usr/share/filebeat/data}
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: containers, mountPath: /var/lib/docker/containers, readOnly: true}
            - {name: podlogs, mountPath: /var/log/pods, readOnly: true}
      volumes:
        - name: config
          configMap: {name: filebeat-config}
        - name: data
          hostPath: {path: /var/lib/filebeat-data, type: DirectoryOrCreate}
        - name: varlog
          hostPath: {path: /var/log}
        - name: containers
          hostPath: {path: /var/lib/docker/containers}
        - name: podlogs
          hostPath: {path: /var/log/pods}
