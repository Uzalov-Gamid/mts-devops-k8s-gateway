name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh cluster/kubeadm/*.sh
      - name: Render kustomizations and validate with kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform
          make -s render | kubeconform -strict -summary -ignore-missing-schemas -
      - name: Validate Prometheus config
        run: |
          mkdir -p /tmp/tok && echo x > /tmp/tok/token
          docker run --rm --entrypoint sh -v "$PWD/deploy/monitoring:/m" -v /tmp/tok:/var/run/secrets/kubernetes.io/serviceaccount \
            prom/prometheus:v3.13.4 -c 'mkdir -p /etc/prometheus/rules && cp /m/rules.yml /etc/prometheus/rules/ && promtool check config /m/prometheus.yml'
      - name: Unit-test Prometheus SLO alert rules
        run: make test-rules
      - name: Validate Filebeat config
        run: |
          docker run --rm -e NODE_NAME=ci -v "$PWD/deploy/logging/filebeat.yml:/etc/filebeat.yml:ro" \
            docker.elastic.co/beats/filebeat:9.4.7 filebeat test config -c /etc/filebeat.yml --strict.perms=false

  e2e:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mts
          config: cluster/kind/kind.yaml
      - name: Deploy
        run: make deploy
      - name: Deploy again (idempotency check)
        run: make deploy
      - name: Verify (Gateway API, Prometheus, Filebeat)
        shell: bash   # bash -eo pipefail: a failing verify must fail the step even through tee
        run: make verify 2>&1 | tee verify.log
      - name: Chaos test (kill pods under load)
        run: make chaos
      - name: Collect diagnostics
        if: always()
        run: |
          kubectl get pods,svc,gateway,httproute -A -o wide > diag.txt 2>&1 || true
          kubectl -n envoy-gateway-system logs deploy/envoy-gateway --tail=200 >> diag.txt 2>&1 || true
          kubectl -n logging logs ds/filebeat --tail=200 >> diag.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: |
            verify.log
            diag.txt
